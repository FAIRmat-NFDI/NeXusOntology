name: NeXus ontology Pages

on:
  push:
    branches:
      - main
      - r2025_11
      - PaNET-inspired
    tags:
      - 'v*.*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/configure-pages@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r definitions/requirements.txt
          pip install owlready2 pygit2

      - name: Generate ontology
        run: python -m script.generate_ontology full

      - name: Download Widoco
        env:
          widoco_url: https://github.com/dgarijo/Widoco/releases/download/v1.4.25/widoco-1.4.25-jar-with-dependencies_JDK-11.jar
        run: wget "${widoco_url}" -O widoco.jar

      - name: Build Pages site at artifact root
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p ./_site/releases/"${VERSION}"
          mkdir -p ./_site/latest

          cp ontology/NeXusOntology_full.owl ./_site/NeXusOntology_full.owl
          cp ontology/NeXusOntology_full.owl ./_site/latest/NeXusOntology_full.owl

          java -jar widoco.jar \
            -ontFile ontology/NeXusOntology_full.owl \
            -outFolder ./_site \
            -getOntologyMetadata \
            -includeAnnotationProperties \
            -rewriteAll

          mv ./_site/index-en.html ./_site/index.html

          cp ontology/NeXusOntology_full.owl "./_site/releases/${VERSION}/NeXusOntology_full.owl"
          cp ./_site/index.html ./_site/latest/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: GitHub Pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5