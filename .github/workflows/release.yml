name: NeXus ontology release

on:
  push:
    branches: ['*']
    tags: ['v*.*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/configure-pages@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r definitions/requirements.txt
          pip install owlready2 pygit2

      - name: Generate ontology
        run: python -m script.generate_ontology full

      - name: Download Widoco
        env:
          widoco_url: https://github.com/dgarijo/Widoco/releases/download/v1.4.25/widoco-1.4.25-jar-with-dependencies_JDK-11.jar
        run: wget "${widoco_url}" -O widoco.jar

      - name: Build release docs and ontology bundle
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p "site/releases/${VERSION}"
          mkdir -p site/latest

          cp ontology/NeXusOntology_full.owl "site/releases/${VERSION}/NeXusOntology_full.owl"
          cp ontology/NeXusOntology_full.owl site/latest/NeXusOntology_full.owl

          java -jar widoco.jar \
            -ontFile ontology/NeXusOntology_full.owl \
            -outFolder "site/releases/${VERSION}/docs" \
            -getOntologyMetadata \
            -includeAnnotationProperties \
            -rewriteAll

          mv "site/releases/${VERSION}/docs/index-en.html" "site/releases/${VERSION}/docs/index.html"
          cp -r "site/releases/${VERSION}/docs" site/latest/docs
          cp "site/releases/${VERSION}/docs/index.html" site/latest/index.html

      - name: Upload release asset
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "NeXus ontology release ${GITHUB_REF_NAME}" \
            --verify-tag || true

          gh release upload "${GITHUB_REF_NAME}" "ontology/NeXusOntology_full.owl" --clobber

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: GitHub Pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5