name: Release NeXusOntology

# Builds and publishes one release per nexusformat/definitions version.
# Manual trigger only (see workflow_dispatch below). Build/validate first;
# Pages deploy and the GitHub release only happen after that passes. The
# Pages site keeps one folder per version plus `latest/`.

on:
  # repository_dispatch:
  #   types: [definitions_release]
  workflow_dispatch:
    inputs:
      definitions_tag:
        description: 'Definitions tag to build (e.g. v2026.01)'
        required: true
      prior_version:
        description: 'Previous ontology version, for owl:priorVersion (e.g. v2025.11)'
        required: false

permissions:
  contents: write

concurrency:
  group: nexusontology-release
  cancel-in-progress: false

env:
  WIDOCO_VERSION: '1.4.25'
  PAGES_BASE: 'https://fairmat-nfdi.github.io/NeXusOntology'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.resolve.outputs.tag }}
      defs_sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve definitions tag and commit
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.definitions_tag }}"
            prior="${{ inputs.prior_version }}"
          else
            tag="${{ github.event.client_payload.tag }}"
            prior="${{ github.event.client_payload.prior_version }}"
          fi
          [ -n "$tag" ] || { echo "::error::no definitions tag supplied"; exit 1; }

          # Default to whatever GitHub currently shows as latest, if not
          # explicitly given. Skips drafts/pre-releases; 404s (first-ever
          # release) just leave $prior empty.
          if [ -z "$prior" ]; then
            prior=$(curl -fsSL \
                      -H "Authorization: Bearer ${{ github.token }}" \
                      -H "Accept: application/vnd.github+json" \
                      "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
                    | python3 -c "import sys, json; print(json.load(sys.stdin).get('tag_name', ''))" \
                    2>/dev/null || true)
            [ -n "$prior" ] && echo "Auto-detected prior version: $prior"
          fi

          # Prefer the dereferenced tag object (^{}) so annotated tags resolve
          # to the commit rather than to the tag object itself.
          sha=$(git ls-remote https://github.com/nexusformat/definitions \
                  "refs/tags/${tag}^{}" | cut -f1)
          if [ -z "$sha" ]; then
            sha=$(git ls-remote https://github.com/nexusformat/definitions \
                    "refs/tags/${tag}" | cut -f1)
          fi
          [ -n "$sha" ] || { echo "::error::tag ${tag} not found in nexusformat/definitions"; exit 1; }

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "prior=$prior" >> "$GITHUB_OUTPUT"
          echo "Building NeXusOntology from definitions ${tag} (${sha})"

      - name: Check out definitions at the release tag
        uses: actions/checkout@v4
        with:
          repository: nexusformat/definitions
          ref: ${{ steps.resolve.outputs.sha }}
          path: definitions
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # Install Python dependencies of the ontology generator at script/generate_ontology.py.
      - name: Install build dependencies
        run: pip install --upgrade pip owlready2 pygit2 lxml rdflib

      # Calls main() directly rather than via __main__, which would otherwise
      # re-checkout a commit inside definitions/ as a side effect.
      - name: Generate ontology
        env:
          DEFS_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p build
          python - <<'PY'
          import os, sys
          sys.path.insert(0, os.getcwd())
          from script.generate_ontology import main
          main(full=True, testdata=False,
               nexus_def_path=os.path.abspath("definitions"),
               def_commit=os.environ["DEFS_TAG"],
               store_commit_filename=False,
               output_dir=os.path.abspath("build"))
          PY
          ls -lh build

      # Stamps version metadata, fixes seeAlso so Widoco renders it, writes ttl/nt/jsonld.
      - name: Post-process (version metadata, seeAlso links, serializations)
        run: |
          set -euo pipefail
          python script/postprocess_release.py \
            --in build/NeXusOntology_full.owl \
            --outdir dist \
            --basename NeXusOntology_full \
            --version "${{ steps.resolve.outputs.tag }}" \
            --definitions-tag "${{ steps.resolve.outputs.tag }}" \
            --definitions-sha "${{ steps.resolve.outputs.sha }}" \
            --prior-version "${{ steps.resolve.outputs.prior }}" \
            --release-url "https://github.com/${{ github.repository }}/releases/tag/${{ steps.resolve.outputs.tag }}"
          ls -lh dist

      - name: Download Widoco
        run: |
          set -euo pipefail
          curl -fsSL -o widoco.jar \
            "https://github.com/dgarijo/Widoco/releases/download/v${WIDOCO_VERSION}/widoco-${WIDOCO_VERSION}-jar-with-dependencies_JDK-17.jar"
          ls -lh widoco.jar

      # -uniteSections required: NeXus IRIs are hash IRIs, every term must be
      # a fragment of one page. These flags take no argument (e.g. `-rewriteAll
      # true` feeds Widoco a stray positional arg).
      - name: Build documentation
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p docs
          java -Xmx6g -jar widoco.jar \
            -ontFile dist/NeXusOntology_full.owl \
            -outFolder docs \
            -getOntologyMetadata \
            -includeAnnotationProperties \
            -uniteSections \
            -noPlaceHolderText \
            -rewriteAll
          test -f docs/index-en.html

      - name: Verify per-IRI anchors and manual links
        run: |
          set -euo pipefail
          for term in NXentry NXdata NXinstrument; do
            grep -q "id=\"${term}\"" docs/index-en.html \
              || { echo "::error::missing documentation anchor for ${term}"; exit 1; }
          done
          grep -q 'manual.nexusformat.org' docs/index-en.html \
            || { echo "::error::no manual.nexusformat.org links rendered in documentation"; exit 1; }
          echo "anchors and manual links OK"

      # deploy-pages replaces the whole site each run, so this seeds from
      # whatever's already published — otherwise every release would delete
      # its predecessors and old versioned redirects would 404.
      - name: Assemble site (preserving previously released versions)
        env:
          VERSION: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages \
              "https://github.com/${GITHUB_REPOSITORY}.git" _site
            rm -rf _site/.git
          else
            mkdir -p _site
          fi

          mkdir -p "_site/${VERSION}"
          cp -r docs/* "_site/${VERSION}/"
          cp dist/NeXusOntology_full.* "_site/${VERSION}/"

          rm -rf _site/latest
          cp -r "_site/${VERSION}" _site/latest

          # Widoco's page is index-en.html, not index.html, so bare folder
          # URLs (…/latest/) 404 without this. Covers old folders too.
          for dir in _site/*/; do
            if [ -f "${dir}index-en.html" ] && [ ! -f "${dir}index.html" ]; then
              cat > "${dir}index.html" <<HTML
          <!DOCTYPE html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./index-en.html">
          <link rel="canonical" href="./index-en.html">
          <p>Redirecting to <a href="./index-en.html">the documentation</a>.</p>
          HTML
            fi
          done

          # Root of the site redirects to the latest documentation.
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <title>NeXusOntology</title>
          <meta http-equiv="refresh" content="0; url=./latest/index-en.html">
          <link rel="canonical" href="./latest/index-en.html">
          <p>Redirecting to the <a href="./latest/index-en.html">latest NeXusOntology documentation</a>.</p>
          HTML

          ls _site

      # actions/deploy-pages never creates a git branch, so there's nothing
      # for the read-side above to find on its own. This step maintains
      # gh-pages itself as storage (one squashed commit per release).
      - name: Persist site history to gh-pages (storage only, not the live site)
        run: |
          set -euo pipefail
          cd _site
          git init -q
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publish ${{ steps.resolve.outputs.tag }}"
          git push --force \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: GitHub Pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: [build, deploy-pages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: NeXusOntology ${{ needs.build.outputs.version }}
          generate_release_notes: true
          body: |
            NeXusOntology generated from
            [nexusformat/definitions ${{ needs.build.outputs.version }}](https://github.com/nexusformat/definitions/tree/${{ needs.build.outputs.defs_sha }}).

            - Documentation: ${{ env.PAGES_BASE }}/${{ needs.build.outputs.version }}/index-en.html
            - Namespace: `https://w3id.org/PaN/NeXus/definitions`
            - Version IRI: `https://w3id.org/PaN/NeXus/definitions/${{ needs.build.outputs.version }}`

            Persistent identifiers:

            - This version: https://w3id.org/PaN/NeXus/definitions/${{ needs.build.outputs.version }}
            - Latest: https://w3id.org/PaN/NeXus/definitions

            Individual terms resolve to their own section of the documentation,
            e.g. https://w3id.org/PaN/NeXus/definitions#NXentry
          files: dist/*