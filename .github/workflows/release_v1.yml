name: NeXusOntology release on definitions release

on:
  push:
    branches: ['*']
  repository_dispatch:
    types: [definitions_release]     # allow the definitions repo (or other automation) to trigger this workflow
  schedule:
    - cron: "0 0 * * *"              # daily check as a fallback (UTC midnight)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nexusontology-definitions-release
  cancel-in-progress: false

env:
  DEFINITIONS_OWNER: nexusformat
  DEFINITIONS_REPO: definitions
  SUBMODULE_PATH: definitions
  TARGET_BRANCH: PaNET-inspired
  WIDOCO_VERSION: 1.4.25
  WIDOCO_URL: https://github.com/dgarijo/Widoco/releases/download/v1.4.25/widoco-1.4.25-jar-with-dependencies_JDK-11.jar

jobs:
  sync-build-release-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout parent repo
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Get latest definitions release tag (or use repository_dispatch payload)
        id: defrel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # If this workflow was triggered via repository_dispatch and a tag is provided in client_payload, use it.
          tag=""
          if [ "${GITHUB_EVENT_NAME:-}" = "repository_dispatch" ] ; then
            if [ -f "${GITHUB_EVENT_PATH:-}" ]; then
              tag="$(jq -r '.client_payload.tag // empty' "$GITHUB_EVENT_PATH" || true)"
            fi
          fi

          if [ -n "$tag" ]; then
            echo "Using tag from repository_dispatch payload: $tag"
          else
            api="https://api.github.com/repos/${DEFINITIONS_OWNER}/${DEFINITIONS_REPO}/releases/latest"
            json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api")"
            tag="$(echo "$json" | jq -r '.tag_name')"
            if [[ -z "$tag" || "$tag" == "null" ]]; then
              echo "Unable to read latest release tag from ${DEFINITIONS_OWNER}/${DEFINITIONS_REPO}"
              exit 1
            fi
            echo "Resolved latest definitions release tag via API: $tag"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Resolve current and target submodule SHA
        id: shas
        run: |
          set -euo pipefail
          # current submodule SHA recorded in parent repo
          current_sha="$(git rev-parse --verify HEAD:${SUBMODULE_PATH} 2>/dev/null || true)"
          # fetch tags in the submodule repository
          git -C "${SUBMODULE_PATH}" fetch --tags origin || true

          # try to resolve tag to commit in submodule
          # prefer environment-provided tag (from previous step)
          target_tag="${{ steps.defrel.outputs.tag }}"
          target_sha="$(git -C "${SUBMODULE_PATH}" rev-list -n 1 "${target_tag}" 2>/dev/null || true)"

          if [[ -z "$target_sha" ]]; then
            echo "Could not resolve definitions tag ${target_tag} to a commit inside submodule ${SUBMODULE_PATH}"
            exit 1
          fi

          echo "current_sha=$current_sha" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Exit if already synced
        id: sync_check
        run: |
          set -euo pipefail
          if [[ "${{ steps.shas.outputs.current_sha }}" == "${{ steps.shas.outputs.target_sha }}" ]]; then
            echo "synced=true" >> "$GITHUB_OUTPUT"
            echo "Already synced to latest definitions release; nothing to do."
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update submodule to latest definitions release commit
        if: steps.sync_check.outputs.synced == 'false'
        run: |
          set -euo pipefail
          git -C "${SUBMODULE_PATH}" checkout "${{ steps.shas.outputs.target_sha }}"
          git add "${SUBMODULE_PATH}"
          git commit -m "chore(definitions): bump to ${{ steps.defrel.outputs.tag }} (${{ steps.shas.outputs.target_sha }})" || echo "No changes to commit"
          # push to the repository's TARGET_BRANCH
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Prepare release tag in parent repo
        if: steps.sync_check.outputs.synced == 'false'
        id: parent_tag
        run: |
          set -euo pipefail
          tag="nexusontology-${{ steps.defrel.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q "${tag}"; then
            echo "Tag ${tag} already exists."
          else
            git tag "${tag}"
            git push origin "refs/tags/${tag}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.sync_check.outputs.synced == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        if: steps.sync_check.outputs.synced == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -r definitions/requirements.txt
          pip install owlready2 pygit2

      - name: Generate ontology
        if: steps.sync_check.outputs.synced == 'false'
        run: python -m script.generate_ontology full

      - name: Download Widoco
        if: steps.sync_check.outputs.synced == 'false'
        env:
          WIDOCO_URL: ${{ env.WIDOCO_URL }}
        run: |
          set -euo pipefail
          wget -q "${WIDOCO_URL}" -O widoco.jar
          ls -lh widoco.jar

      - name: Build website content with Widoco (include annotation props, imports, stable anchors)
        if: steps.sync_check.outputs.synced == 'false'
        env:
          VERSION: ${{ steps.parent_tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p ./_site/releases/"${VERSION}"
          mkdir -p ./_site/latest

          # copy ontology to site root and latest
          cp ontology/NeXusOntology_full.owl ./_site/NeXusOntology_full.owl
          cp ontology/NeXusOntology_full.owl ./_site/latest/NeXusOntology_full.owl

          # Widoco invocation - explicit flags to ensure inclusion of annotation properties,
          # imported ontologies and stable anchors derived from entity local names.
          java -jar widoco.jar \
            -ontFile ontology/NeXusOntology_full.owl \
            -outFolder ./_site \
            -getOntologyMetadata true \
            -includeAnnotationProperties true \
            -includeImportedOntologies true \
            -rewriteAll true \
            -rewriteOntURIs true || { echo "Widoco failed"; exit 1; }

          # Make index.html consistent and copy release-specific files
          if [ -f ./_site/index-en.html ]; then
            mv ./_site/index-en.html ./_site/index.html
          fi

          cp ontology/NeXusOntology_full.owl "./_site/releases/${VERSION}/NeXusOntology_full.owl"
          if [ -f ./_site/index.html ]; then
            cp ./_site/index.html "./_site/releases/${VERSION}/index.html"
            cp ./_site/index.html ./_site/latest/index.html
          fi

      - name: Upload Pages artifact
        if: steps.sync_check.outputs.synced == 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        if: steps.sync_check.outputs.synced == 'false'
        uses: actions/deploy-pages@v4

      - name: Package release assets
        if: steps.sync_check.outputs.synced == 'false'
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp ontology/NeXusOntology_full.owl "release-assets/NeXusOntology_full-${{ steps.parent_tag.outputs.tag }}.owl"
          tar -czf "release-assets/NeXusOntology_docs-${{ steps.parent_tag.outputs.tag }}.tar.gz" -C _site .

      - name: Create/update GitHub release with assets
        if: steps.sync_check.outputs.synced == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parent_tag.outputs.tag }}
          target_commitish: ${{ env.TARGET_BRANCH }}
          name: NeXusOntology ${{ steps.parent_tag.outputs.tag }}
          generate_release_notes: true
          body: |
            Automated release after definitions bump.
            Definitions release: ${{ steps.defrel.outputs.tag }}
            Definitions commit: ${{ steps.shas.outputs.target_sha }}
          files: |
            release-assets/NeXusOntology_full-${{ steps.parent_tag.outputs.tag }}.owl
            release-assets/NeXusOntology_docs-${{ steps.parent_tag.outputs.tag }}.tar.gz